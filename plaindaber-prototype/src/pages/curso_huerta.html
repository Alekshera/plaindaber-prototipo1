        <!-- Perfil de usuario: avatar y salir -->
        <div class="user-profile">
            <div class="avatar" id="userAvatar">MG</div>
            <button onclick="logout()" class="logout-btn" title="Cerrar Sesión">

                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path>

    <!-- ==========================================================
         ÁREA PRINCIPAL
         ========================================================== -->
    <main class="main-content">

        <!-- Barra superior horizontal (igual que Cursos y Dashboard) -->
        <div class="top-banner mb-8">
            <div class="top-banner-inner w-full">
                <div class="min-w-0">
                    <a href="cursos.html" class="back-link">← Volver a cursos</a>
                    <h1 class="banner-title" id="pageTitle">Huertas Orgánicas en la Ciudad</h1>
                </div>
                <div class="flex items-center gap-3">
                    <a href="modulo.html?id=1" id="linkModuloDetalle" class="btn btn-primary banner-cta">Abrir módulo interactivo →</a>
                    <!-- <a href="../../mapa_navegacion.html" class="btn-map">Mapa de Navegación</a> -->
                </div>
            </div>
        </div>

        <!-- Fila: lista de módulos + contenido detallado -->
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">

            <!-- Columna izquierda: lista de módulos (acordeón) -->
            <section class="module-list" aria-label="Lista de módulos">
                <h2 class="section-title text-xl">Módulos del curso</h2>
                <div id="moduleList" class="flex flex-col gap-3"></div>
            </section>

            <!-- Columna derecha: contenido del módulo seleccionado -->
            <section id="contentPanel" class="lg:col-span-2" aria-live="polite">
                <!-- Inserto aquí el contenido dinámico mediante JS -->
            </section>
        </div>
    </main>

    <!-- ==========================================================
         SCRIPT DE LA PÁGINA
         ========================================================== -->
    <script type="module" src="../js/curso_huerta.js"></script>

    <!-- Enlace al detalle de módulo: apunta al módulo activo del curso -->
    <script>
        document.addEventListener('DOMContentLoaded', function () {
            const enlace = document.getElementById('linkModuloDetalle');
            if (!enlace) return;
            const activo = localStorage.getItem('moduloGlobalActivo');
            const modulos = (window.DATA && window.DATA.modulos) || [];
            const id = activo && modulos.some(m => Number(m.id) === Number(activo)) ? Number(activo) : 1;
            enlace.setAttribute('href', 'modulo.html?id=' + id);
        });
    </script>
</body>
</html>
