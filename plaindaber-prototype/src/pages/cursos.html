<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cursos - PLAINDABER</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/dashboard.css" />
    <script type="module" src="../js/cursos.js"></script>
</head>
<body class="bg-[#FDFBF7] text-body">

    <!-- ============ SIDEBAR ============ -->
    <div class="sidebar text-white">
        <!-- Botón para ocultar el menú -->
        <button class="sidebar-toggle" id="sidebarToggle" aria-label="Ocultar menú" title="Ocultar menú">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path>
            </svg>
        </button>
        <!-- Navegación -->
        <nav class="sidebar-nav">
            <a href="dashboard.html" class="nav-item">
                <svg class="nav-icon w-5 h-5" fill="none" stroke="#FFD54F" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M3 12l2-3m0 0l7-4 7 4M5 9v10a1 1 0 001 1h12a1 1 0 001-1V9m-9 11l4-4m0 0l4 4m-4-4V3"></path>
                </svg>
                <span class="sidebar-tooltip">Dashboard</span>
            </a>

            <a href="#" class="nav-item active">
                <svg class="nav-icon w-5 h-5" fill="none" stroke="#E8913B" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M12 6.253v13m0-13C10.5 6.253 2 10.998 2 17.25c0 5.25 3.75 9.15 10 9.15s10-3.9 10-9.15c0-6.252-8.5-10.997-10-10.997z"></path>
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M15 12l-3 2-1 3-2-2-3 1" fill="none"></path>
                </svg>
                <span class="sidebar-tooltip">Cursos</span>
            </a>

            <a href="foro.html" class="nav-item">
                <svg class="nav-icon w-5 h-5" fill="none" stroke="#C27CD6" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M7 8h10M7 12h4m1 8l-4-4H5a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v8a2 2 0 01-2 2h-3l-4 4z"></path>
                </svg>
                <span class="sidebar-tooltip">Foro</span>
            </a>

            <a href="videollamada.html" class="nav-item">
                <svg class="nav-icon w-5 h-5" fill="none" stroke="#7EB0E8" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M15 10l4.553-2.276A1 1 0 0121 8.618v6.764a1 1 0 01-1.447.894L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z"></path>
                </svg>
                <span class="sidebar-tooltip">Videollamadas</span>
            </a>
        </nav>

        <!-- Perfil de usuario -->
        <div class="user-profile">
            <div class="avatar" id="userAvatar">MG</div>
            <button onclick="logout()" class="logout-btn" title="Cerrar Sesión">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path>
                </svg>
            </button>
        </div>
    </div>

    <!-- ============ CONTENIDO PRINCIPAL ============ -->
    <!-- Overlay del drawer (móvil) -->
    <div class="sidebar-overlay" id="sidebarOverlay"></div>

    <main class="main-content">

        <!-- Encabezado azul superior -->
        <div class="top-banner mb-8">
            <div class="top-banner-inner w-full">
                <div class="banner-start">
                    <button class="banner-hamburger" id="hamburgerBtn" aria-label="Mostrar menú" title="Mostrar menú">
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path>
                        </svg>
                    </button>
                    <img src="/logo-plaindaber-nuevo.png" alt="Plaindaber" class="banner-logo" />
                </div>
                <div>
                    <h1 class="banner-title" id="pageTitle">Cursos</h1>
                    <p class="banner-subtitle" id="pageSubtitle">Explora el catálogo de cursos</p>
                </div>
                <a href="../../mapa_navegacion.html" class="btn-map">Mapa de Navegación</a>
            </div>
        </div>

        <!-- Barra de filtros -->
        <div class="card mb-8">
            <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                <!-- Búsqueda -->
                <div class="flex flex-col gap-1">
                    <label for="searchInput" class="text-sm font-semibold text-[#1A3B5C]">Buscar</label>
                    <input
                        type="search"
                        id="searchInput"
                        placeholder="Buscar por título o descripción..."
                        aria-label="Buscar cursos"
                        class="w-full rounded-xl border-2 border-gray-200 px-4 py-2 text-sm focus:border-[#7B1FA2] focus:outline-none" />
                </div>

                <!-- Filtro por área -->
                <div class="flex flex-col gap-1">
                    <label for="areaSelect" class="text-sm font-semibold text-[#1A3B5C]">Área de Saber</label>
                    <select
                        id="areaSelect"
                        aria-label="Filtrar por área de saber"
                        class="w-full rounded-xl border-2 border-gray-200 px-4 py-2 text-sm focus:border-[#7B1FA2] focus:outline-none">
                        <option value="todas">Todas las áreas</option>
                    </select>
                </div>

                <!-- Filtro por estado -->
                <div class="flex flex-col gap-1">
                    <label for="stateSelect" class="text-sm font-semibold text-[#1A3B5C]">Estado</label>
                    <select
                        id="stateSelect"
                        aria-label="Filtrar por estado de inscripción"
                        class="w-full rounded-xl border-2 border-gray-200 px-4 py-2 text-sm focus:border-[#7B1FA2] focus:outline-none">
                        <option value="todos">Todos</option>
                        <option value="inscrito">Inscrito</option>
                        <option value="disponible">Disponible</option>
                        <option value="completado">Completado</option>
                        <option value="construccion">En Construcción</option>
                    </select>
                </div>
            </div>
        </div>

        <!-- Contador de resultados -->
        <p id="resultsCount" class="text-sm text-gray-500 mb-4">Mostrando 0 cursos</p>

        <!-- Grid de tarjetas de cursos -->
        <div id="coursesGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6"></div>

        <!-- Mensaje cuando no hay resultados -->
        <div id="emptyState" class="hidden text-center py-16 text-gray-500">
            No se encontraron cursos con los filtros seleccionados.
        </div>

        <!-- Paginación (simulada) -->
        <nav class="mt-10 flex items-center justify-center gap-2" aria-label="Paginación de cursos">
            <button class="px-4 py-2 rounded-xl border-2 border-gray-200 text-gray-500 cursor-not-allowed opacity-50" aria-label="Página anterior">← Anterior</button>
            <button class="w-10 h-10 rounded-xl bg-[#7B1FA2] text-white font-semibold" aria-current="page">1</button>
            <button class="w-10 h-10 rounded-xl border-2 border-gray-200 text-gray-600 hover:bg-gray-100">2</button>
            <button class="w-10 h-10 rounded-xl border-2 border-gray-200 text-gray-600 hover:bg-gray-100">3</button>
            <button class="px-4 py-2 rounded-xl border-2 border-gray-200 text-gray-600 hover:border-[#7B1FA2]">Siguiente →</button>
        </div>
    </main>

    <!-- ============ MODAL DE CONFIRMACIÓN DE INSCRIPCIÓN ============ -->
    <div id="enrollModal" class="hidden fixed inset-0 z-50 items-center justify-center bg-black/40 p-4">
        <div class="card w-full max-w-md">
            <h3 class="text-xl font-bold text-[#1A3B5C] mb-2">Inscripción al curso</h3>
            <p class="text-gray-600 text-sm mb-6">
                ¿Confirmas que deseas inscribirte en <span id="modalCourseName" class="font-semibold text-[#7B1FA2]"></span>?
            </p>
            <div class="flex justify-end gap-3">
                <button id="cancelEnrollBtn" class="btn-secondary">Cancelar</button>
                <button id="confirmEnrollBtn" class="btn-primary">Confirmar</button>
            </div>
        </div>
    </div>

    <!-- ============ TOAST DE ÉXITO ============ -->
    <div id="toast" class="hidden fixed bottom-6 right-6 z-50 bg-[#1A3B5C] text-white px-5 py-3 rounded-xl shadow-lg"></div>

    <script>
        // Guardar la referencia a logout de forma global
        window.logout = function () {
            if (confirm('¿Estás seguro de que deseas cerrar sesión?')) {
                window.location.href = './login.html';
            }
        };
    </script>

    <script>
        // Sidebar: drawer en móvil, colapsable en desktop
        (function () {
            const sidebar = document.querySelector('.sidebar');
            if (!sidebar) return;

            const toggleBtn = document.getElementById('sidebarToggle');
            const hamburgerBtn = document.getElementById('hamburgerBtn');
            const overlay = document.getElementById('sidebarOverlay');
            const KEY = 'plaindaber_sidebar_collapsed';
            const mq = window.matchMedia('(max-width: 768px)');

            const openDrawer = function () {
                sidebar.classList.add('open');
                if (overlay) overlay.classList.add('visible');
            };

            const closeDrawer = function () {
                sidebar.classList.remove('open');
                if (overlay) overlay.classList.remove('visible');
            };

            const setCollapsed = function (collapsed) {
                sidebar.classList.toggle('collapsed', collapsed);
                document.body.classList.toggle('sidebar-collapsed', collapsed);
                if (!mq.matches) localStorage.setItem(KEY, collapsed ? '1' : '0');
            };

            const updateMode = function () {
                if (mq.matches) {
                    closeDrawer();
                    setCollapsed(true);
                } else {
                    closeDrawer();
                    setCollapsed(localStorage.getItem(KEY) === '1');
                }
            };

            if (hamburgerBtn) hamburgerBtn.addEventListener('click', function (e) {
                e.preventDefault();
                e.stopPropagation();
                if (mq.matches) {
                    if (sidebar.classList.contains('open')) closeDrawer();
                    else openDrawer();
                } else {
                    setCollapsed(false);
                }
            });

            if (toggleBtn) toggleBtn.addEventListener('click', function () { setCollapsed(true); });

            if (overlay) overlay.addEventListener('click', closeDrawer);

            sidebar.querySelectorAll('.nav-item').forEach(function (link) {
                link.addEventListener('click', function () {
                    if (mq.matches) closeDrawer();
                });
            });

            if (mq.addEventListener) mq.addEventListener('change', updateMode);
            else if (mq.addListener) mq.addListener(updateMode);

            updateMode();
        })();
    </script>
</body>
</html>
