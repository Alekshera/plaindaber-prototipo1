<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Foro de Discusión - PLAINDABER</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/dashboard.css" />
    <link rel="stylesheet" href="../css/foro.css" />
    <script type="module" src="../js/foro.js"></script>
</head>
<body class="bg-[#FDFBF7] text-body">

    <!-- ============ SIDEBAR ============ -->
    <div class="sidebar text-white">
        <!-- Logo -->
        <div class="logo-wrap">
            <img src="/logo-plaindaber-nuevo.png" alt="Plaindaber" />
        </div>

        <!-- Navegación -->
        <nav class="sidebar-nav">
            <a href="dashboard.html" class="nav-item">
                <svg class="nav-icon w-5 h-5" fill="none" stroke="#FFD54F" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M3 12l2-3m0 0l7-4 7 4M5 9v10a1 1 0 001 1h12a1 1 0 001-1V9m-9 11l4-4m0 0l4 4m-4-4V3"></path>
                </svg>
                <span class="sidebar-tooltip">Dashboard</span>
            </a>

            <a href="cursos.html" class="nav-item">
                <svg class="nav-icon w-5 h-5" fill="none" stroke="#E8913B" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M12 6.253v13m0-13C10.5 6.253 2 10.998 2 17.25c0 5.25 3.75 9.15 10 9.15s10-3.9 10-9.15c0-6.252-8.5-10.997-10-10.997z"></path>
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M15 12l-3 2-1 3-2-2-3 1" fill="none"></path>
                </svg>
                <span class="sidebar-tooltip">Cursos</span>
            </a>

            <a href="foro.html" class="nav-item active">
                <svg class="nav-icon w-5 h-5" fill="none" stroke="#C27CD6" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M7 8h10M7 12h4m1 8l-4-4H5a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v8a2 2 0 01-2 2h-3l-4 4z"></path>
                </svg>
                <span class="sidebar-tooltip">Foro</span>
                <span class="notification-badge" style="display: block;"></span>
            </a>

            <a href="videollamada.html" class="nav-item">
                <svg class="nav-icon w-5 h-5" fill="none" stroke="#7EB0E8" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M15 10l4.553-2.276A1 1 0 0121 8.618v6.764a1 1 0 01-1.447.894L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z"></path>
                </svg>
                <span class="sidebar-tooltip">Videollamadas</span>
            </a>

            <a href="#" class="nav-item">
                <svg class="nav-icon w-5 h-5" fill="none" stroke="#B0A0DC" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path>
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
                </svg>
                <span class="sidebar-tooltip">Configuración</span>
            </a>
        </nav>

        <!-- Perfil de usuario -->
        <div class="user-profile">
            <div class="avatar" id="userAvatar">AF</div>
            <button onclick="logout()" class="logout-btn" title="Cerrar Sesión">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path>
                </svg>
            </button>
        </div>
    </div>

    <!-- ============ CONTENIDO PRINCIPAL ============ -->
    <main class="main-content">

        <!-- Encabezado azul superior -->
        <div class="top-banner mb-8">
            <div class="top-banner-inner w-full">
                <div>
                    <h1 class="banner-title" id="pageTitle">Foro de Discusión</h1>
                    <p class="banner-subtitle" id="pageSubtitle">General · Huertas Orgánicas en la Ciudad</p>
                </div>
                <!-- <a href="../../mapa_navegacion.html" class="btn-map">Mapa de Navegación</a> -->
            </div>
        </div>

        <!-- Barra de acciones -->
        <div class="card mb-8">
            <div class="flex flex-col md:flex-row md:items-center gap-4">
                <!-- Búsqueda por título -->
                <div class="flex-1">
                    <label for="searchInput" class="text-sm font-semibold text-[#1A3B5C] mb-1 block">Buscar hilos</label>
                    <input
                        type="search"
                        id="searchInput"
                        placeholder="Buscar por título..."
                        aria-label="Buscar hilos"
                        class="w-full rounded-xl border-2 border-gray-200 px-4 py-2 text-sm focus:border-[#822375] focus:outline-none" />
                </div>
                <!-- Botón nuevo hilo -->
                <div class="md:pt-5">
                    <button id="btnNuevoHilo" class="btn-primary w-full md:w-auto inline-flex items-center gap-2">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path>
                        </svg>
                        Nuevo Hilo
                    </button>
                </div>
            </div>
        </div>

        <!-- Contador de resultados -->
        <p id="resultsCount" class="text-sm text-gray-500 mb-4"></p>

        <!-- ============ VISTA: LISTA DE HILOS ============ -->
        <div id="vistaLista">
            <div id="hilosContainer" class="grid grid-cols-1 gap-6"></div>
            <!-- Mensaje cuando no hay hilos -->
            <div id="emptyState" class="hidden text-center py-16 text-gray-500">
                No se encontraron hilos con los filtros seleccionados.
            </div>
        </div>

        <!-- ============ VISTA: DETALLE DEL HILO ============ -->
        <div id="vistaDetalle" class="hidden">
            <!-- Botón volver -->
            <button id="btnVolver" class="btn-secondary mb-6 inline-flex items-center gap-2">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path>
                </svg>
                Volver a la lista
            </button>

            <!-- Cabecera del hilo -->
            <div class="card mb-6" id="detalleCabecera"></div>

            <!-- Mensajes en orden cronológico -->
            <div id="mensajesContainer" class="space-y-6 mb-8"></div>

            <!-- Zona de acciones (Instructor/Admin) -->
            <div id="zonaAcciones" class="card mb-8 hidden"></div>

            <!-- Formulario de respuesta (solo hilos ACTIVOS) -->
            <div id="formularioRespuesta" class="card mb-8 hidden">
                <h3 class="text-lg font-bold text-[#1A3B5C] mb-4">Responder</h3>
                <form id="formRespuesta">
                    <div class="relative mb-4">
                        <textarea id="respuestaInput" rows="3" required
                            placeholder="Responde al hilo...  (usa @ para mencionar a alguien)"
                            class="w-full rounded-xl border-2 border-gray-200 px-4 py-3 text-sm focus:border-[#822375] focus:outline-none"></textarea>

                        <!-- Cita a la que se está respondiendo (respuesta directa) -->
                        <div id="chipRespuesta" class="hidden"></div>

                        <!-- Desplegable de menciones @usuario -->
                        <ul id="mencionesDropdown" class="menciones-dropdown hidden"></ul>
                    </div>

                    <!-- Hint de la línea de respuesta -->
                    <p id="hintRespuesta" class="text-xs text-gray-500 mb-3">Escribiendo nueva respuesta al hilo.</p>

                    <button type="submit" class="btn-primary">Enviar respuesta</button>
                </form>
            </div>
        </div>
    </main>

    <!-- ============ MODAL: NUEVO HILO ============ -->
    <div id="modalNuevoHilo" class="modal-overlay hidden">
        <div class="modal-contenido card">
            <div class="flex items-center justify-between mb-6">
                <h3 class="text-xl font-bold text-[#1A3B5C]">Crear nuevo hilo</h3>
                <button id="btnCerrarModal" class="text-gray-400 hover:text-[#822375] text-2xl leading-none">&times;</button>
            </div>
            <form id="formNuevoHilo">
                <div class="mb-4">
                    <label for="nuevoTitulo" class="block text-sm font-semibold text-[#1A3B5C] mb-2">Título</label>
                    <input type="text" id="nuevoTitulo" required placeholder="Título del hilo"
                        class="w-full rounded-xl border-2 border-gray-200 px-4 py-2 text-sm focus:border-[#822375] focus:outline-none" />
                </div>
                <div class="mb-6">
                    <label for="nuevoContenido" class="block text-sm font-semibold text-[#1A3B5C] mb-2">Contenido</label>
                    <textarea id="nuevoContenido" rows="4" required placeholder="Describe tu pregunta o tema..."
                        class="w-full rounded-xl border-2 border-gray-200 px-4 py-3 text-sm focus:border-[#822375] focus:outline-none"></textarea>
                </div>
                <div class="flex justify-end gap-3">
                    <button type="button" id="btnCancelarHilo" class="btn-secondary">Cancelar</button>
                    <button type="submit" class="btn-primary">Crear hilo</button>
                </div>
            </form>
        </div>
    </div>

    <!-- ============ TOAST DE NOTIFICACIÓN ============ -->
    <div id="toast" class="hidden fixed bottom-6 right-6 z-50 bg-[#1A3B5C] text-white px-5 py-3 rounded-xl shadow-lg"></div>

    <script>
        // logout global (las demás páginas lo definen así)
        window.logout = function () {
            if (confirm('¿Estás seguro de que deseas cerrar sesión?')) {
                window.location.href = './login.html';
            }
        };
    </script>
</body>
</html>
