    <!-- ============ CONTENIDO PRINCIPAL ============ -->
    <!-- Overlay del drawer (móvil) -->

    <main class="main-content">

        <!-- Encabezado azul superior -->

            <div class="top-banner-inner w-full">
                <div class="banner-start">
                    <button class="banner-hamburger" id="hamburgerBtn" aria-label="Mostrar menú" title="Mostrar menú">

                        </svg>
                    </button>
                    <img src="/plaindaber-prototipo1/logo-plaindaber-nuevo.png" alt="Plaindaber" class="banner-logo" />
                </div>
                <div>
                    <a href="curso_huerta.html" class="back-link" id="backLink">← Volver al curso</a>
                    <h1 class="banner-title" id="bannerCurso">Huertas Orgánicas en la Ciudad</h1>
                </div>
                <div class="text-right hidden md:block">
                    <p class="banner-date" id="bannerProgresoGlobal">Progreso del curso</p>
                </div>
                <!-- <a href="../../mapa_navegacion.html" class="btn-map">Mapa de Navegación</a> -->
            </div>
        </div>

        <!-- Contenedor principal: relleno dinámico desde js/modulo.js -->
        <div id="contenidoPanel" class="contenedor-principal">
            <!-- Cabecera del módulo (JS) -->
            <div id="cabeceraModulo"></div>

            <!-- Área de contenido dinámico por tipo -->
            <div id="contenidosModulo"></div>

            <!-- Barra de navegación anterior/siguiente y completar -->
            <div id="navAcciones"></div>

            <!-- Feedback global -->
            <div id="feedback" class="hidden"></div>
        </div>
    </main>

    <!-- ============ MODAL: EVALUACIÓN DEL MÓDULO ============ -->
    <div id="modalEvaluacion" class="modulo-overlay hidden">
        <div class="modulo-modal card">
            <div class="flex items-center justify-between mb-4">
                <h3 class="text-xl font-bold text-[#1A3B5C]" id="evalTitulo">Evaluación del módulo</h3>
                <button id="btnCerrarEval" class="text-gray-400 hover:text-[#822375] text-2xl leading-none">&times;</button>
            </div>
            <div id="evalPreguntas" class="space-y-4 mb-6"></div>
            <div class="flex justify-between items-center">
                <span id="evalResultado" class="text-sm font-semibold"></span>
                <button id="btnEnviarEval" class="btn-primary">Enviar evaluación</button>
            </div>
        </div>
    </div>

    <script>
        window.logout = function () {
            if (confirm('¿Estás seguro de que deseas cerrar sesión?')) {
                window.location.href = './login.html';
            }
        };
    </script>

    <script>
        // Sidebar: drawer en móvil, colapsable en desktop
        (function () {
            const sidebar = document.querySelector('.sidebar');
            if (!sidebar) return;

            const toggleBtn = document.getElementById('sidebarToggle');
            const hamburgerBtn = document.getElementById('hamburgerBtn');
            const overlay = document.getElementById('sidebarOverlay');
            const KEY = 'plaindaber_sidebar_collapsed';
            const mq = window.matchMedia('(max-width: 768px)');

            const openDrawer = function () {
                sidebar.classList.add('open');
                if (overlay) overlay.classList.add('visible');
            };

            const closeDrawer = function () {
                sidebar.classList.remove('open');
                if (overlay) overlay.classList.remove('visible');
            };

            const setCollapsed = function (collapsed) {
                sidebar.classList.toggle('collapsed', collapsed);
                document.body.classList.toggle('sidebar-collapsed', collapsed);
                if (!mq.matches) localStorage.setItem(KEY, collapsed ? '1' : '0');
            };

            const updateMode = function () {
                if (mq.matches) {
                    closeDrawer();
                    setCollapsed(true);
                } else {
                    closeDrawer();
                    setCollapsed(localStorage.getItem(KEY) === '1');
                }
            };

            if (hamburgerBtn) hamburgerBtn.addEventListener('click', function (e) {
                e.preventDefault();
                e.stopPropagation();
                if (mq.matches) {
                    if (sidebar.classList.contains('open')) closeDrawer();
                    else openDrawer();
                } else {
                    setCollapsed(false);
                }
            });

            if (toggleBtn) toggleBtn.addEventListener('click', function () { setCollapsed(true); });

            if (overlay) overlay.addEventListener('click', closeDrawer);

            sidebar.querySelectorAll('.nav-item').forEach(function (link) {
                link.addEventListener('click', function () {
                    if (mq.matches) closeDrawer();
                });
            });

            if (mq.addEventListener) mq.addEventListener('change', updateMode);
            else if (mq.addListener) mq.addListener(updateMode);

            updateMode();
        })();
    </script>
</body>
</html>
